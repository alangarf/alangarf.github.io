{% capture srcset %}
{% for i in resized %}
    /{{ i.path }} {{ i.width }}w,
{% endfor %}
{% endcapture %}

{% assign original_filename = path | split: '/' | last %}

<img src="/{{ resized.first.path }}" alt="{{ alt }}" srcset="{{ srcset | strip_newlines }} {{ original_filename }} {{ original.width }}w">
